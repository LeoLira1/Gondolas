name: Build & Release APK

on:
  push:
    branches:
      - main
      - "claude/gondola-3d-flutter-prototype-9637uw"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android project structure
        # Gera o projeto Android padrão do Flutter num diretório temporário
        # e copia apenas a pasta android/ para o workspace.
        # Isso evita incluir binários (gradle-wrapper.jar) no repositório.
        run: |
          flutter create \
            --org com.camda \
            --project-name gondola_camda \
            /tmp/scaffold

          # Corrige o label do app no manifesto
          sed -i \
            's/android:label="gondola_camda"/android:label="Gôndola CAMDA"/' \
            /tmp/scaffold/android/app/src/main/AndroidManifest.xml

          cp -r /tmp/scaffold/android .

      - name: Install CMake 3.31.4
        # flutter_angle (dependência do three_js) exige CMake 3.31.4.
        # O runner não tem essa versão no SDK Android, então instalamos
        # direto do Kitware e apontamos via cmake.dir em local.properties.
        run: |
          CMAKE_VERSION="3.31.4"
          CMAKE_INSTALL="/opt/cmake-${CMAKE_VERSION}"

          wget -q \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            -O /tmp/cmake.tar.gz

          sudo mkdir -p "${CMAKE_INSTALL}"
          sudo tar -xzf /tmp/cmake.tar.gz -C "${CMAKE_INSTALL}" --strip-components=1

          # Adiciona ao PATH para uso geral
          echo "${CMAKE_INSTALL}/bin" >> "$GITHUB_PATH"

          # Aponta o AGP para esta instalação via local.properties
          echo "cmake.dir=${CMAKE_INSTALL}" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gondola-camda-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Gôndola 3D CAMDA #${{ github.run_number }}"
          body: |
            ## Gôndola 3D CAMDA — Protótipo

            APK de validação visual. Instale no tablet e teste:
            - **Arrastar** para girar 360°
            - **Pinçar** para zoom in/out

            **Build:** #${{ github.run_number }} | Branch: `${{ github.ref_name }}`
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
